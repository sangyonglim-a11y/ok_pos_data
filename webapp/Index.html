<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#163028" />
  <title>중계고기파티 재고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#163028', soft: '#1e3f34', mist: '#d7e3dc', ink: '#13241e' },
            paper: { DEFAULT: '#f4f1eb', card: '#fffcf7', line: '#e4ddd2' },
            ok: '#1f7a4c', wait: '#c46a1b'
          },
          boxShadow: { panel: '0 10px 30px rgba(22,48,40,.08)' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
:root {
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }

body {
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(31,122,76,.08), transparent 55%),
    linear-gradient(180deg, #efeae2 0%, #f4f1eb 40%, #f7f4ef 100%);
}

/* custom scrollbars */
.scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-thin::-webkit-scrollbar-thumb {
  background: #c9c1b4;
  border-radius: 999px;
}
.scroll-thin::-webkit-scrollbar-track { background: transparent; }

.tap {
  min-height: 44px;
  min-width: 44px;
}

.nav-item {
  transition: background .18s ease, transform .18s ease, color .18s ease;
}
.nav-item:hover { transform: translateX(2px); }

.row-hover:hover { background: #f7faf7; }

.card-press:active { transform: scale(.985); }

.badge-ok { background: #e7f6ee; color: #1f7a4c; }
.badge-wait { background: #fff1e0; color: #c46a1b; }

/* 모바일: 한 화면에 많이 보이도록 촘촘한 행 */
.dense-list {
  background: #fff;
  border-top: 1px solid #e4ddd2;
}
.dense-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid #eee7dc;
  min-height: 56px;
  background: #fff;
}
.dense-row.is-dirty { background: #fff8e8; }
.dense-row.is-checked { background: #f4faf6; }
.dense-check {
  width: 22px;
  height: 22px;
  accent-color: #1f7a4c;
  flex: 0 0 auto;
}

.receipt-frame {
  background:
    linear-gradient(135deg, rgba(22,48,40,.06), rgba(22,48,40,.02)),
    repeating-linear-gradient(
      -12deg,
      transparent,
      transparent 10px,
      rgba(22,48,40,.03) 10px,
      rgba(22,48,40,.03) 11px
    );
}

@media (max-width: 1023px) {
  .desktop-only { display: none !important; }
}
@media (min-width: 1024px) {
  .mobile-only { display: none !important; }
}

  </style>
</head>
<body class="bg-paper text-brand-ink antialiased">
  <div id="root"></div>
  <script>
/* =========================================================
   중계고기파티 재고 SPA
   ========================================================= */

const API_URL = "https://script.google.com/macros/s/AKfycbz69R3uqp6NTTEwNxIQ5RVFtrJU8aim6p8KxJtS1UbxKN5WWx4MrMv8D5R_F1My48z6kg/exec";
const USE_MOCK_WHEN_EMPTY = false;

const MENUS = [
  { id: "inspect", label: "실물 검수", icon: "fa-clipboard-check", badge: "count" },
  { id: "balance", label: "거래처 금액 검증", icon: "fa-scale-balanced", badge: "warn" },
  { id: "price", label: "단가 추이", icon: "fa-chart-line", badge: null },
  { id: "stock", label: "재고 및 발주 관리", icon: "fa-boxes-stacked", badge: null },
];

const state = {
  pin: sessionStorage.getItem("stockPin") || "",
  menu: "inspect",
  query: "",
  filterDate: "전체",
  filterVendor: "전체",
  pendingOnly: true,
  month: "",
  rows: [],
  draft: {}, // rowNumber -> boolean (화면 체크 상태)
  selectedId: null,
  loading: false,
  applying: false,
  error: "",
  toast: "",
  warnCount: 0,
};

const root = document.getElementById("root");

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatDate(value) {
  const text = String(value ?? "").trim();
  const iso = text.match(/(\d{4})[-/.](\d{2})[-/.](\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const eng = text.match(/(\w{3})\s+(\w{3})\s+(\d{1,2})\s+(\d{4})/);
  if (eng) {
    const months = { Jan: "01", Feb: "02", Mar: "03", Apr: "04", May: "05", Jun: "06", Jul: "07", Aug: "08", Sep: "09", Oct: "10", Nov: "11", Dec: "12" };
    const mm = months[eng[2]] || "01";
    const dd = String(eng[3]).padStart(2, "0");
    return `${eng[4]}-${mm}-${dd}`;
  }
  return text;
}

function toast(message) {
  state.toast = message;
  render();
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    state.toast = "";
    render();
  }, 2200);
}

async function api(action, payload = {}) {
  if (!API_URL) {
    if (!USE_MOCK_WHEN_EMPTY) throw new Error("API_URL 을 설정해 주세요.");
    return mockApi(action, payload);
  }
  const body = { action, pin: state.pin, ...payload };
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
    redirect: "follow",
  });
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

function mockApi(action, payload) {
  if (!mockApi._rows) {
    mockApi._rows = [
      { row: 12, date: "2026-10-28", vendor: "(주)회승", name: "이베리코 목살", spec: "1 Box / 11.96kg", qty: "1", code: "M0015", final: "11.96", checked: false },
      { row: 13, date: "2026-10-28", vendor: "(주)회승", name: "삼겹살", spec: "1 Box / 9.40kg", qty: "1", code: "M0012", final: "9.40", checked: false },
      { row: 18, date: "2026-10-29", vendor: "신선농산", name: "양파", spec: "망 / 20kg", qty: "2", code: "V003", final: "40", checked: true },
      { row: 21, date: "2026-10-30", vendor: "백두주류", name: "하이볼 베이스", spec: "1.5L × 6", qty: "3", code: "D010", final: "18", checked: false },
      { row: 25, date: "2026-10-31", vendor: "대한공산", name: "위생장갑", spec: "100매", qty: "10", code: "G002", final: "10", checked: false },
    ];
  }
  if (action === "inspectionList" || action === "login") {
    return Promise.resolve({ month: "2026-10", warnCount: 3, rows: JSON.parse(JSON.stringify(mockApi._rows)) });
  }
  if (action === "applyInspection") {
    (payload.changes || []).forEach((c) => {
      const row = mockApi._rows.find((r) => r.row === Number(c.row));
      if (row) row.checked = !!c.checked;
    });
    return Promise.resolve({ ok: true, count: (payload.changes || []).length, message: "반영했습니다." });
  }
  return Promise.reject(new Error("알 수 없는 요청입니다."));
}

function draftChecked(row) {
  const key = String(row.row);
  return Object.prototype.hasOwnProperty.call(state.draft, key) ? state.draft[key] : !!row.checked;
}

function dirtyChanges() {
  return state.rows
    .filter((r) => draftChecked(r) !== !!r.checked)
    .map((r) => ({ row: r.row, checked: draftChecked(r) }));
}

function waitingCount() {
  return state.rows.filter((r) => !draftChecked(r)).length;
}

function dateOptions() {
  const set = new Set(state.rows.map((r) => formatDate(r.date)).filter(Boolean));
  return ["전체", ...Array.from(set).sort()];
}

function vendorOptions() {
  let rows = state.rows;
  if (state.filterDate !== "전체") {
    rows = rows.filter((r) => formatDate(r.date) === state.filterDate);
  }
  const set = new Set(rows.map((r) => r.vendor).filter(Boolean));
  return ["전체", ...Array.from(set).sort((a, b) => a.localeCompare(b, "ko"))];
}

function visibleRows() {
  const q = state.query.trim().toLowerCase();
  return state.rows.filter((r) => {
    const date = formatDate(r.date);
    if (state.filterDate !== "전체" && date !== state.filterDate) return false;
    if (state.filterVendor !== "전체" && r.vendor !== state.filterVendor) return false;
    if (state.pendingOnly && draftChecked(r)) return false;
    if (!q) return true;
    return `${date} ${r.vendor} ${r.name} ${r.spec} ${r.code}`.toLowerCase().includes(q);
  });
}

function selectedRow() {
  return state.rows.find((r) => r.row === state.selectedId) || null;
}

function resetDraftFromRows() {
  state.draft = {};
  state.rows.forEach((r) => {
    state.draft[String(r.row)] = !!r.checked;
  });
}

async function loadInspection() {
  state.loading = true;
  state.error = "";
  render();
  try {
    const data = await api("inspectionList", {});
    state.month = data.month || "";
    state.rows = (data.rows || []).map((r) => ({ ...r, date: formatDate(r.date) }));
    state.warnCount = data.warnCount || 0;
    resetDraftFromRows();
    if (!state.rows.some((r) => r.row === state.selectedId)) {
      const first = state.rows.find((r) => !r.checked) || state.rows[0];
      state.selectedId = first ? first.row : null;
    }
  } catch (err) {
    state.error = err.message || "불러오지 못했습니다.";
  } finally {
    state.loading = false;
    render();
  }
}

function setDraft(rowNumber, checked) {
  state.draft[String(rowNumber)] = checked;
  render();
}

async function applyDraft() {
  const changes = dirtyChanges();
  if (!changes.length) {
    toast("변경된 체크가 없습니다.");
    return;
  }
  state.applying = true;
  render();
  try {
    const result = await api("applyInspection", { changes });
    changes.forEach((c) => {
      const row = state.rows.find((r) => r.row === c.row);
      if (row) row.checked = c.checked;
    });
    resetDraftFromRows();
    toast(result.message || `${changes.length}건 적용했습니다.`);
  } catch (err) {
    toast(err.message || "적용에 실패했습니다.");
  } finally {
    state.applying = false;
    render();
  }
}

function renderPin() {
  root.innerHTML = `
    <div class="min-h-full grid place-items-center p-4">
      <form id="pinForm" class="w-full max-w-md bg-paper-card border border-paper-line rounded-2xl shadow-panel p-6">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 rounded-xl bg-brand text-white grid place-items-center text-lg"><i class="fa-solid fa-store"></i></div>
          <div>
            <h1 class="text-xl font-bold text-brand">중계고기파티</h1>
            <p class="text-sm text-black/55">재고관리 · 직원 로그인</p>
          </div>
        </div>
        <p class="text-sm text-black/60 mb-3">직원용 비밀번호를 입력하세요.</p>
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password"
          class="w-full tap rounded-xl border border-paper-line px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand/30" />
        ${state.error ? `<p class="text-red-700 text-sm mt-2">${esc(state.error)}</p>` : ""}
        <button class="mt-4 w-full tap rounded-xl bg-brand text-white font-semibold">들어가기</button>
      </form>
    </div>`;
  document.getElementById("pinForm").onsubmit = async (e) => {
    e.preventDefault();
    const pin = document.getElementById("pinInput").value.trim();
    if (!pin) return;
    state.pin = pin;
    try {
      await api("inspectionList", { pin });
      sessionStorage.setItem("stockPin", pin);
      state.error = "";
      await loadInspection();
    } catch (err) {
      state.pin = "";
      sessionStorage.removeItem("stockPin");
      state.error = err.message || "로그인에 실패했습니다.";
      render();
    }
  };
}

function sidebarHtml() {
  const wait = waitingCount();
  return `
    <aside class="desktop-only w-64 shrink-0 bg-brand text-white flex flex-col min-h-0">
      <div class="px-5 py-5 border-b border-white/10">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-white/10 grid place-items-center"><i class="fa-solid fa-store"></i></div>
          <div>
            <div class="font-bold text-lg leading-tight">중계고기파티</div>
            <div class="text-xs text-white/65">재고관리 콘솔</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto scroll-thin">
        ${MENUS.map((m) => {
          const on = state.menu === m.id;
          let badge = "";
          if (m.badge === "count") badge = `<span class="ml-auto text-[11px] font-bold bg-white text-brand rounded-full px-2 py-0.5">${wait}</span>`;
          if (m.badge === "warn") badge = `<span class="ml-auto text-[10px] font-bold bg-[#ffd9a8] text-[#8a4b00] rounded-full px-2 py-0.5">확인요망</span>`;
          return `<button data-menu="${m.id}" class="nav-item w-full tap flex items-center gap-3 rounded-xl px-3 py-3 text-left ${on ? "bg-white/15" : "hover:bg-white/10"}">
            <i class="fa-solid ${m.icon} w-5 text-center opacity-90"></i>
            <span class="text-sm font-medium">${m.label}</span>${badge}
          </button>`;
        }).join("")}
      </nav>
    </aside>`;
}

function mobileHeaderHtml() {
  const dirty = dirtyChanges().length;
  return `
    <header class="mobile-only sticky top-0 z-20 bg-brand text-white px-3 py-2">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-white/10 grid place-items-center text-sm"><i class="fa-solid fa-store"></i></div>
        <div class="min-w-0 flex-1">
          <div class="font-bold text-sm truncate">중계고기파티 · 검수</div>
          <div class="text-[10px] text-white/65">${esc(state.month)} · 대기 ${waitingCount()}건${dirty ? ` · 변경 ${dirty}` : ""}</div>
        </div>
        <button id="mobileRefresh" class="tap rounded-lg px-2 hover:bg-white/10"><i class="fa-solid fa-rotate-right"></i></button>
        <button id="mobileApply" class="tap rounded-lg bg-ok px-3 text-sm font-bold ${dirty ? "" : "opacity-50"}" ${dirty && !state.applying ? "" : "disabled"}>
          ${state.applying ? "적용중" : "적용"}
        </button>
      </div>
    </header>`;
}

function mobileTabsHtml() {
  return `
    <nav class="mobile-only fixed bottom-0 inset-x-0 z-20 bg-brand text-white grid grid-cols-4 border-t border-white/10 pb-[env(safe-area-inset-bottom)]">
      ${MENUS.map((m) => {
        const on = state.menu === m.id;
        return `<button data-menu="${m.id}" class="tap py-2 text-[11px] ${on ? "text-white" : "text-white/55"}">
          <div class="text-base mb-0.5"><i class="fa-solid ${m.icon}"></i></div>${m.label.split(" ")[0]}
        </button>`;
      }).join("")}
    </nav>`;
}

function toolbarHtml() {
  const dirty = dirtyChanges().length;
  const dates = dateOptions();
  const vendors = vendorOptions();
  return `
    <div class="mb-3 space-y-2">
      <div class="desktop-only flex items-center justify-between gap-3">
        <h2 class="text-xl font-bold tracking-tight">${esc(state.month || "—")} 실물 검수</h2>
        <div class="text-sm text-black/50">변경 ${dirty}건 · 대기 ${waitingCount()}건</div>
      </div>
      <div class="grid grid-cols-2 gap-2 lg:grid-cols-4">
        <label class="block">
          <span class="sr-only">거래일자</span>
          <select id="filterDate" class="w-full tap rounded-xl border border-paper-line bg-white px-3 text-sm">
            ${dates.map((d) => `<option value="${esc(d)}" ${d === state.filterDate ? "selected" : ""}>${d === "전체" ? "날짜: 전체" : d}</option>`).join("")}
          </select>
        </label>
        <label class="block">
          <span class="sr-only">거래처</span>
          <select id="filterVendor" class="w-full tap rounded-xl border border-paper-line bg-white px-3 text-sm">
            ${vendors.map((v) => `<option value="${esc(v)}" ${v === state.filterVendor ? "selected" : ""}>${v === "전체" ? "거래처: 전체" : esc(v)}</option>`).join("")}
          </select>
        </label>
        <button id="btnPending" class="tap rounded-xl border border-paper-line bg-white px-3 text-sm">
          ${state.pendingOnly ? "대기만 보기" : "전체 보기"}
        </button>
        <button id="btnApply" class="desktop-only tap rounded-xl bg-ok text-white px-4 text-sm font-bold ${dirty ? "hover:brightness-110" : "opacity-50"}" ${dirty && !state.applying ? "" : "disabled"}>
          ${state.applying ? "적용 중…" : `적용${dirty ? ` (${dirty})` : ""}`}
        </button>
      </div>
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-black/35 text-xs"></i>
          <input id="searchInput" value="${esc(state.query)}" placeholder="품목·코드 검색"
            class="w-full tap rounded-xl border border-paper-line bg-white pl-8 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/25" />
        </div>
        <button id="btnRefresh" class="tap rounded-xl border border-paper-line bg-white px-3"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
      <p class="text-[11px] text-black/45">체크만 하고, 위 <b>적용</b>을 눌러야 시트에 반영됩니다.</p>
    </div>`;
}

function tableHtml(rows) {
  if (state.loading) return `<div class="p-6 text-sm text-black/50">불러오는 중…</div>`;
  if (!rows.length) return `<div class="p-6 text-sm text-black/50">조건에 맞는 입고가 없습니다.</div>`;
  return `
    <div class="desktop-only overflow-auto scroll-thin rounded-2xl border border-paper-line bg-white shadow-panel">
      <table class="min-w-full text-sm">
        <thead class="bg-[#f3f6f3] text-black/55 sticky top-0">
          <tr class="text-left">
            <th class="px-3 py-2.5 w-12">검수</th>
            <th class="px-3 py-2.5 font-medium">거래일자</th>
            <th class="px-3 py-2.5 font-medium">거래처</th>
            <th class="px-3 py-2.5 font-medium">품목명</th>
            <th class="px-3 py-2.5 font-medium">단위/규격</th>
            <th class="px-3 py-2.5 font-medium text-right">수량</th>
            <th class="px-3 py-2.5 font-medium">상태</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r) => {
            const checked = draftChecked(r);
            const dirty = checked !== !!r.checked;
            const on = r.row === state.selectedId;
            return `<tr data-row="${r.row}" class="row-hover border-t border-paper-line cursor-pointer ${on ? "bg-[#eef6f1]" : ""} ${dirty ? "bg-[#fff8e8]" : ""}">
              <td class="px-3 py-2">
                <input type="checkbox" class="w-5 h-5 accent-ok" data-check="${r.row}" ${checked ? "checked" : ""} />
              </td>
              <td class="px-3 py-2 whitespace-nowrap">${esc(formatDate(r.date))}</td>
              <td class="px-3 py-2">${esc(r.vendor)}</td>
              <td class="px-3 py-2 font-medium">${esc(r.name)}</td>
              <td class="px-3 py-2 text-black/60">${esc(r.spec)}</td>
              <td class="px-3 py-2 text-right tabular-nums">${esc(r.final || r.qty)}</td>
              <td class="px-3 py-2">
                <span class="inline-flex rounded-full px-2 py-0.5 text-[11px] font-semibold ${checked ? "badge-ok" : "badge-wait"}">
                  ${checked ? "검수완료" : "검수대기"}${dirty ? "*" : ""}
                </span>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

function cardsHtml(rows) {
  if (state.loading) return `<div class="mobile-only p-4 text-sm text-black/50">불러오는 중…</div>`;
  if (!rows.length) return `<div class="mobile-only p-4 text-sm text-black/50">조건에 맞는 입고가 없습니다.</div>`;
  return `
    <div class="mobile-only dense-list pb-24">
      ${rows.map((r) => {
        const checked = draftChecked(r);
        const dirty = checked !== !!r.checked;
        return `
        <label class="dense-row ${dirty ? "is-dirty" : ""} ${checked ? "is-checked" : ""}">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-[10px] font-semibold ${checked ? "text-ok" : "text-wait"}">${checked ? "완료" : "대기"}${dirty ? "*" : ""}</span>
              <span class="text-[10px] text-black/40 truncate">${esc(formatDate(r.date))} · ${esc(r.vendor)}</span>
            </div>
            <div class="font-bold text-[15px] leading-tight truncate">${esc(r.name)}</div>
            <div class="text-[11px] text-black/50 truncate mt-0.5">${esc(r.spec)} · <b class="text-brand-ink">${esc(r.final || r.qty)}</b></div>
          </div>
          <input type="checkbox" class="dense-check" data-check="${r.row}" ${checked ? "checked" : ""} />
        </label>`;
      }).join("")}
    </div>`;
}

function detailHtml() {
  const row = selectedRow();
  if (!row) {
    return `
      <aside class="desktop-only w-80 shrink-0 border-l border-paper-line bg-paper-card p-5">
        <h3 class="font-bold text-lg mb-2">선택 전표 상세</h3>
        <p class="text-sm text-black/50">목록에서 전표를 선택하세요.</p>
      </aside>`;
  }
  const checked = draftChecked(row);
  return `
    <aside class="desktop-only w-80 shrink-0 border-l border-paper-line bg-paper-card p-5 overflow-y-auto scroll-thin">
      <h3 class="font-bold text-lg mb-4">선택 전표 상세</h3>
      <div class="rounded-2xl border border-paper-line bg-white p-4 shadow-sm mb-4">
        <div class="text-xs text-black/45 mb-1">거래처</div>
        <div class="font-bold text-lg">${esc(row.vendor)}</div>
        <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
          <div><div class="text-xs text-black/45">거래일</div><div class="font-medium">${esc(formatDate(row.date))}</div></div>
          <div><div class="text-xs text-black/45">화면 체크</div>
            <span class="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold ${checked ? "badge-ok" : "badge-wait"}">${checked ? "검수완료" : "검수대기"}</span>
          </div>
          <div class="col-span-2"><div class="text-xs text-black/45">품목</div><div class="font-medium">${esc(row.name)}</div></div>
          <div><div class="text-xs text-black/45">규격</div><div>${esc(row.spec)}</div></div>
          <div><div class="text-xs text-black/45">반영수량</div><div class="font-semibold">${esc(row.final || row.qty)}</div></div>
        </div>
        <label class="mt-4 flex items-center gap-3 tap rounded-xl border border-paper-line px-3">
          <input type="checkbox" class="w-5 h-5 accent-ok" data-check="${row.row}" ${checked ? "checked" : ""} />
          <span class="text-sm font-medium">이 전표 검수 체크</span>
        </label>
        <p class="mt-2 text-[11px] text-black/45">체크 후 상단 <b>적용</b>을 눌러야 저장됩니다.</p>
      </div>
      <div class="text-sm font-semibold mb-2">영수증 / 명세서 미리보기</div>
      <div class="receipt-frame rounded-2xl border border-dashed border-paper-line min-h-[220px] grid place-items-center text-center p-4 text-sm text-black/45">
        <div><i class="fa-regular fa-image text-3xl mb-2 block text-brand/30"></i>이미지 연동 예정</div>
      </div>
    </aside>`;
}

function placeholderMenu(title) {
  return `
    <div class="flex-1 grid place-items-center p-8 text-center">
      <div>
        <div class="text-4xl text-brand/25 mb-3"><i class="fa-solid fa-screwdriver-wrench"></i></div>
        <h2 class="text-xl font-bold mb-2">${esc(title)}</h2>
        <p class="text-sm text-black/50">다음 단계에서 연결됩니다.</p>
      </div>
    </div>`;
}

function renderApp() {
  const rows = visibleRows();
  const inspectMain = `
    <section class="flex-1 min-w-0 min-h-0 flex flex-col p-3 lg:p-6 overflow-hidden">
      ${toolbarHtml()}
      ${state.error ? `<div class="mb-2 text-sm text-red-700">${esc(state.error)}</div>` : ""}
      <div class="flex-1 min-h-0 overflow-y-auto scroll-thin">
        ${tableHtml(rows)}
        ${cardsHtml(rows)}
      </div>
    </section>`;

  let main = inspectMain;
  if (state.menu === "balance") main = placeholderMenu("거래처 금액 검증");
  if (state.menu === "price") main = placeholderMenu("단가 추이");
  if (state.menu === "stock") main = placeholderMenu("재고 및 발주 관리");

  root.innerHTML = `
    <div class="h-full flex flex-col lg:flex-row min-h-0">
      ${sidebarHtml()}
      <div class="flex-1 min-w-0 min-h-0 flex flex-col">
        ${mobileHeaderHtml()}
        <div class="flex-1 min-h-0 flex">
          ${main}
          ${state.menu === "inspect" ? detailHtml() : `<aside class="desktop-only w-80 shrink-0 border-l border-paper-line bg-paper-card"></aside>`}
        </div>
        ${mobileTabsHtml()}
      </div>
      ${state.toast ? `<div class="fixed left-1/2 -translate-x-1/2 bottom-24 lg:bottom-8 z-50 bg-brand text-white text-sm px-4 py-2.5 rounded-full shadow-lg">${esc(state.toast)}</div>` : ""}
    </div>`;
  bindAppEvents();
}

function bindAppEvents() {
  document.querySelectorAll("[data-menu]").forEach((btn) => {
    btn.onclick = () => {
      state.menu = btn.getAttribute("data-menu");
      render();
    };
  });

  const dateEl = document.getElementById("filterDate");
  if (dateEl) {
    dateEl.onchange = () => {
      state.filterDate = dateEl.value;
      state.filterVendor = "전체";
      render();
    };
  }
  const vendorEl = document.getElementById("filterVendor");
  if (vendorEl) {
    vendorEl.onchange = () => {
      state.filterVendor = vendorEl.value;
      render();
    };
  }

  const search = document.getElementById("searchInput");
  if (search) {
    search.oninput = () => {
      state.query = search.value;
      clearTimeout(bindAppEvents._q);
      bindAppEvents._q = setTimeout(render, 120);
    };
  }

  document.getElementById("btnPending")?.addEventListener("click", () => {
    state.pendingOnly = !state.pendingOnly;
    render();
  });
  document.getElementById("btnRefresh")?.addEventListener("click", () => loadInspection());
  document.getElementById("mobileRefresh")?.addEventListener("click", () => loadInspection());
  document.getElementById("btnApply")?.addEventListener("click", () => applyDraft());
  document.getElementById("mobileApply")?.addEventListener("click", () => applyDraft());

  document.querySelectorAll("tr[data-row]").forEach((tr) => {
    tr.onclick = (e) => {
      if (e.target.matches("input[type=checkbox]")) return;
      state.selectedId = Number(tr.getAttribute("data-row"));
      render();
    };
  });

  document.querySelectorAll("input[data-check]").forEach((box) => {
    box.onchange = (e) => {
      e.stopPropagation();
      setDraft(Number(box.getAttribute("data-check")), box.checked);
    };
    box.onclick = (e) => e.stopPropagation();
  });
}

function render() {
  if (!state.pin) renderPin();
  else renderApp();
}

(async function boot() {
  render();
  if (state.pin) await loadInspection();
})();

  </script>
</body>
</html>
